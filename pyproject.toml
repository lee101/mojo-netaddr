[project]
name = "mojo-netaddr"
version = "0.1.0"
description = "netaddr-compatible IP address and network math accelerated with Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "netaddr"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
